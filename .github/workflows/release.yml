name: CI Sandbox Debug Compiler

on:
  push:
    branches:
      - 'ci-debug' # 🚀 Triggers instantly on a simple git push to this branch!

jobs:
  debug-build:
    name: Rapid Compile Test (Windows Only)
    runs-on: windows-latest # We isolate strictly to Windows since Mac is already green

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Mounts the MSVC compiler binaries into the PATH environment so Ninja can call cl.exe directly
      - name: Setup MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1

      # Chocolatey comes pre-installed on GitHub Windows runners, making this instantaneous
      - name: Install Ninja Build Tool
        run: choco install ninja -y

      - name: Initialize Central Binaries Directory
        shell: bash
        run: mkdir -p ui/frontend/target/x86_64-pc-windows-msvc/release/binaries

      # 🚀 TARGETED TEST ZONE: Using Ninja to completely drop the MSBuild overhead
      - name: Compile C++ Sidecar Engine
        shell: bash
        run: |
          cd ai
          mkdir -p build
          cd build
          # -G "Ninja" tells CMake to generate low-level ninja build scripts instead of heavy .vcxproj XMLs
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          ninja