name: Automated Release Packaging

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push an explicit release tag like v1.0.0

permissions:
  contents: write # Grants the runner permissions to publish artifacts directly to your Releases page

jobs:
  release:
    name: Build Assets for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: stock_app_windows.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: stock_app_mac_silicon.zip

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 1. Initialize Python (For Docling/PyInstaller)
      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 2. Initialize Go Environment (For your Scraper Daemon)
      - name: Initialize Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # 3. Initialize Stable Rust Compiler
      - name: Install Stable Rust Compiler
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # WINDOWS ONLY: Provision LLVM toolchain so we can use lld-link to easily handle Go assets
      - name: Install LLVM Toolchain (Windows Only)
        if: matrix.os == 'windows-latest'
        run: choco install llvm -y
        
      # MAC ONLY: Provision pkg-config so Apache Arrow can map system layouts safely
      - name: Install Mac Native Build Dependencies (Mac Only)
        if: matrix.os == 'macos-latest'
        run: brew install pkg-config

      # Compiles the workspace targeting the explicit frontend manifest path location
      - name: Compile Cross-Platform Production Binary
        shell: bash
        env:
          RUSTFLAGS:  ${{ matrix.os == 'windows-latest' && '-C linker=lld-link.exe' || '' }}
        run: |
          cargo build --release --target ${{ matrix.target }} --manifest-path ui/frontend/Cargo.toml --workspace

      # WINDOWS PACKAGING ROUTINE
      - name: Package Release Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd ui/frontend/target/${{ matrix.target }}/release
          Compress-Archive -Path stock_app.exe, binaries -DestinationPath "${{ github.workspace }}/${{ matrix.artifact_name }}" -Force

      # MAC PACKAGING ROUTINE
      - name: Package Release Archive (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          cd ui/frontend/target/${{ matrix.target }}/release
          zip -r "${{ github.workspace }}/${{ matrix.artifact_name }}" stock_app binaries

      # Dispatches the compiled ZIP packages straight from the workspace root into GitHub Releases
      - name: Broadcast Compilation to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/${{ matrix.artifact_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}