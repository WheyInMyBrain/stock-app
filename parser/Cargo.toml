[package]
name = "parser"
version = "0.1.0"
edition = "2024"

[lib]
name = "parser"
crate-type = ["rlib"]

[dependencies]
rayon = "1.10"
quick-xml = "0.36"
hashbrown = "0.14"
polars = { version = "0.41", features = ["lazy", "temporal", "fmt", "parquet"] }
glob = "0.3.3"
regex = "1.12.3"
lazy_static = "1.5.0"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
