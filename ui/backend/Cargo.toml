[package]
name = "stock_app_backend"
version = "0.1.0"
description = "stock-app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "backend"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "backend"
path = "src/main.rs"

[build-dependencies]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["time", "rt-multi-thread", "sync", "macros", "net"] }
base64 = "0.22.1"
parquet = "54.3.1"
bytes = "1.11.1"
polars = { version = "0.41", features = ["lazy", "strings", "temporal", "parquet", "pivot", "dtype-struct", "diagonal_concat"] }

analysis = { path = "../../analysis" }
parser = { path = "../../parser" }
downloader = { path = "../../downloader-rust" }
